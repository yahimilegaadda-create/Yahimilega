<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YahiMilega - Sab Kuch</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FFF8F0] font-sans">
<header class="bg-white p-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
<div class="flex items-center gap-2"><span class="font-extrabold text-xl text-orange-500">YahiMilega</span><span class="bg-black text-white text-[10px] px-2 py-1 rounded-full font-bold">SAB KUCH</span></div>
<button class="bg-black text-white px-5 py-2 rounded-full text-sm">Search</button>
</header>

<div class="max-w-md mx-auto p-3">
<div class="bg-gradient-to-br from-orange-500 to-red-500 rounded-[30px] p-6 text-white">
<h1 class="text-[28px] font-extrabold leading-8">Yaha Sab Kuch Milega, Ek Hi Jagah!</h1>
<p class="text-sm opacity-90 mt-2">Shayari, Sarkari Result, Govt Job, College Notes...</p>
<div class="flex gap-2 mt-4"><span class="bg-white/20 px-3 py-1 rounded-full text-xs">Shayari</span><span class="bg-white/20 px-3 py-1 rounded-full text-xs">Result</span><span class="bg-white/20 px-3 py-1 rounded-full text-xs">Jobs</span></div>
</div>

<div id="liveBox" class="hidden mt-4 bg-white border-2 border-orange-500 p-5 rounded-[20px]">
<h2 id="liveTitle" class="font-bold text-lg"></h2>
<p id="liveText" class="text-sm text-gray-600 mt-1"></p>
<button onclick="document.getElementById('liveBox').classList.add('hidden')" class="mt-3 bg-black text-white text-xs px-4 py-2 rounded-full">Band Karo</button>
</div>

<div class="bg-white rounded-[20px] p-4 mt-4 shadow-sm">
<h3 class="font-bold text-sm mb-3">📝 Shayari Adda</h3>
<div class="grid grid-cols-2 gap-2">
<button onclick="openLive('Love Shayari')" class="bg-pink-50 py-2.5 rounded-xl text-xs font-bold">❤️ Love Shayari</button>
<button onclick="openLive('Dard Shayari')" class="bg-pink-50 py-2.5 rounded-xl text-xs font-bold">💖 Dard Shayari</button>
<button onclick="openLive('Dosti Shayari')" class="bg-green-50 py-2.5 rounded-xl text-xs font-bold">🤝 Dosti Shayari</button>
<button onclick="openLive('Attitude Shayari')" class="bg-yellow-50 py-2.5 rounded-xl text-xs font-bold">😎 Attitude</button>
</div>
</div>

<div class="bg-white rounded-[20px] p-4 mt-3 shadow-sm">
<h3 class="font-bold text-sm mb-3">💼 Govt Job & Yojana</h3>
<div class="grid grid-cols-2 gap-2">
<button onclick="openLive('Railway Job')" class="bg-orange-50 py-2.5 rounded-xl text-xs font-bold">🚂 Railway</button>
<button onclick="openLive('Police / Army Job')" class="bg-blue-50 py-2.5 rounded-xl text-xs font-bold">👮 Police / Army</button>
<button onclick="openLive('SSC / UPSC Job')" class="bg-pink-50 py-2.5 rounded-xl text-xs font-bold">📚 SSC / UPSC</button>
<button onclick="openLive('Sarkari Yojana')" class="bg-yellow-50 py-2.5 rounded-xl text-xs font-bold">💰 Sarkari Yojana</button>
</div>
</div>

<div class="bg-white rounded-[20px] p-4 mt-3 shadow-sm">
<h3 class="font-bold text-sm mb-3">🎓 Result & Admit Card</h3>
<div class="grid grid-cols-2 gap-2">
<button onclick="openLive('10th Result')" class="bg-gray-50 py-2.5 rounded-xl text-xs font-bold">10th Result</button>
<button onclick="openLive('12th Result')" class="bg-gray-50 py-2.5 rounded-xl text-xs font-bold">12th Result</button>
<button onclick="openLive('University Result')" class="bg-gray-50 py-2.5 rounded-xl text-xs font-bold">University Result</button>
<button onclick="openLive('Admit Card')" class="bg-gray-50 py-2.5 rounded-xl text-xs font-bold">Admit Card</button>
</div>
</div>

<div class="bg-white rounded-[20px] p-4 mt-3 shadow-sm">
<h3 class="font-bold text-sm mb-3">🏫 School / College Gyan</h3>
<div class="grid grid-cols-2 gap-2">
<button onclick="openLive('Class 9-12 Notes')" class="bg-blue-50 py-2.5 rounded-xl text-xs font-bold">Class 9-12 Notes</button>
<button onclick="openLive('BA / BSc / MA Notes')" class="bg-blue-50 py-2.5 rounded-xl text-xs font-bold">BA / BSc / MA</button>
<button onclick="openLive('Fashion / Mehndi')" class="bg-green-50 py-2.5 rounded-xl text-xs font-bold">Fashion / Mehndi</button>
<button onclick="openLive('Meme / Jokes')" class="bg-yellow-50 py-2.5 rounded-xl text-xs font-bold">Meme / Jokes</button>
</div>
</div>
</div>

<script>
function openLive(name){
const box=document.getElementById('liveBox');
const title=document.getElementById('liveTitle');
const text=document.getElementById('liveText');
box.classList.remove('hidden');
title.innerText=name+' - LIVE Ho Gaya!';
if(name === 'Love Shayari'){
text.innerHTML = `बहुत कुछ जान के जाना है तुमको,<br>बड़ी मुश्किल से पहचाना है तुमको।<br>मुझे जो तुम समझते हो गलत है,<br>किसी दिन ये भी समझाना है तुमको।।`;
}else{
text.innerText=name+' ka sara content yaha ayega. Ab ye button clickable hai!';
}
window.scrollTo({top:200, behavior:'smooth'});
}
</script>
</body>
  </html>
